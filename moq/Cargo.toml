[package]
name = "keryx-moq"
version = "0.1.0"
edition = "2024"
description = "The native MoQ client for keryx calls: MoQ over qmux on a WebSocket, sealing its frames"
authors = ["Pouriya Jahanbakhsh <pouriya.jahanbakhsh@gmail.com>"]
# moq-net 0.2 and openmls 0.9, through keryx-core, both need 1.91.
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/pouriya/keryx"
publish = false

[dependencies]
# SFrame sealing and opening, call keys, and the wire types of call events and call text.
keryx-core = { path = "../core" }

# The MoQ fan-out: origins, broadcasts, tracks, groups and frames, and the moq-lite 05 session.
# Stays on 0.2, chosen by the author, because it takes qmux 0.5's session directly. Brings kio,
# web-async, web-transport-trait and num_enum.
moq-net = "0.2.22"

# MoQ over a WebSocket, through `Upgraded` on a socket keryx-moq opened itself. Only `ws`: no TLS
# yet, chosen by the author, so no rustls and no root store. Brings web-transport-proto and futures.
qmux = { version = "0.5.3", default-features = false, features = ["ws"] }

# Opens the WebSocket with the Bearer header and the subprotocol, which qmux's own client cannot
# send. The version axum already pulls in. `connect` is the client over a plain TCP socket.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect"] }

# One current-thread runtime per call, on its own thread, chosen by the author. `net` for the socket,
# `time` for the 10-second connect wait and moq-net's own timers, `sync` for the command channel,
# `macros` for select!. Already in the tree.
tokio = { version = "1.54.1", default-features = false, features = ["rt", "net", "time", "sync", "macros"] }

# The Stream and Sink traits the adapter between the WebSocket and qmux implements, the ones
# qmux names. Already brought in by qmux's `ws`.
futures = { version = "0.3.32", default-features = false, features = ["std"] }

# A call event's and call text's JSON on the events and text tracks. Already in the tree.
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }

thiserror = "2.0.21"

# Opened media is wiped when dropped. Already in the tree.
zeroize = "1.9.1"
